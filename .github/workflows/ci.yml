name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar  Repositiorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencies
        run: npm install

      - name: Iniciar Servidor
        run: node index.js &

      - name: Eserar Servidor
        run: sleep 5

      - name: Ejecutar Pruebas
        run: npm test